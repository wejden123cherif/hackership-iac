---
# Playbook principal (scope Person 3). Suppose que l'inventaire a déjà été
# généré/rempli à partir des outputs Pulumi de Person 1/2.
#
# Usage : ansible-playbook site.yml --ask-vault-pass

- name: Provisionnement du nœud de données (PostgreSQL + Redis)
  hosts: db
  become: true
  roles:
    - base
    - security
    - db

- name: Provisionnement des nœuds applicatifs Hackership
  hosts: app
  become: true
  serial: 1   # jamais plus d'un nœud indisponible à la fois
  roles:
    - base
    - security
    - reverse_proxy
    - hackership_app
